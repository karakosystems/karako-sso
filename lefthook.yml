pre-commit:
    parallel: true
    commands:
        actionlint:
            glob: ".github/workflows/*.yml"
            run: actionlint {staged_files}
        lint:
            glob: "*.{ts,tsx}"
            # vp wraps oxlint to resolve its plugins (see CLAUDE.md); a bare
            # `oxlint` cannot find eslint-plugin-storybook.
            run: bun run lint

commit-msg:
    commands:
        conventional:
            run: "grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9-]+\\))?!?: .+' {1}"
