pre-commit:
  parallel: true
  commands:
    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}
    lint:
      glob: "*.{ts,tsx}"
      run: bunx oxlint {staged_files}

commit-msg:
  commands:
    conventional:
      run: "grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9-]+\\))?!?: .+' {1}"
