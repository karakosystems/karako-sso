name: Security

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    codeql:
        name: CodeQL (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                language:
                    - javascript-typescript
                    - actions
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Initialize CodeQL
              uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none

            # Uploading to code scanning needs Advanced Security, which a private
            # repository does not have, so the SARIF is inspected in the job instead.
            - name: Analyze
              uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
              with:
                  output: codeql-results
                  upload: never
                  upload-database: false

            - name: Report findings
              run: |
                  jq -s '[.[].runs[].results[]]' codeql-results/*.sarif > findings.json
                  jq -r '.[] | "\(.locations[0].physicalLocation.artifactLocation.uri): \(.message.text)"' findings.json
                  test "$(jq length findings.json)" -eq 0

    trivy:
        name: Trivy (filesystem)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Scan filesystem
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: fs
                  scan-ref: .
                  format: table
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: "1"
