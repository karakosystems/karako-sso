version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      ignore:
          # TypeScript 7 (the Go rewrite) has no typescript-eslint release that
          # supports it yet, so bumping it breaks `bun lint`. Drop this ignore
          # once typescript-eslint ships TS 7 support.
          # https://github.com/typescript-eslint/typescript-eslint/issues/10940
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: America/Port-au-Prince
      open-pull-requests-limit: 5
      commit-message:
          prefix: "ci"
      labels:
          - "dependencies"
          - "github-actions"
      groups:
          actions-minor-patch:
              update-types: ["minor", "patch"]

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: America/Port-au-Prince
      open-pull-requests-limit: 3
      commit-message:
          prefix: "docker"
      labels:
          - "dependencies"
          - "docker"
