version: 2
updates:
    - package-ecosystem: "bun"
      directory: "/"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "build"
      groups:
          react:
              patterns:
                  - "react"
                  - "react-dom"
                  - "@types/react"
                  - "@types/react-dom"
          vite-plus:
              patterns:
                  - "vite-plus"
                  - "vitest"
                  - "@vitest/*"
          storybook:
              patterns:
                  - "storybook"
                  - "@storybook/*"

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: America/Port-au-Prince
      open-pull-requests-limit: 5
      commit-message:
          prefix: "ci"
      labels:
          - "dependencies"
          - "github-actions"
      groups:
          actions-minor-patch:
              update-types: ["minor", "patch"]

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: America/Port-au-Prince
      open-pull-requests-limit: 3
      commit-message:
          prefix: "docker"
      labels:
          - "dependencies"
          - "docker"
