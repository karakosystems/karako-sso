name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What you are trying to do and why the current version falls short.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: The change you have in mind, and any alternative you considered.
      validations:
          required: true
