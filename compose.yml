services:
    keycloak:
        build:
            context: .
            dockerfile: Dockerfile
            pull: true
        image: karako/sso:dev
        ports:
            - "8888:8080"
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        command: start-dev
        healthcheck:
            test:
                - CMD-SHELL
                - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"
            interval: 10s
            timeout: 5s
            retries: 20
            start_period: 20s
        volumes:
            - keycloak_data:/opt/keycloak/data

volumes:
    keycloak_data:
