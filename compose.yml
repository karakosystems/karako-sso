services:
    keycloak:
        build:
            context: .
            dockerfile: Dockerfile
        image: karako/iam:dev
        ports:
            - "8888:8080"
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        command: start-dev
        volumes:
            - keycloak_data:/opt/keycloak/data

volumes:
    keycloak_data:
